name: CI

on:
    workflow_call:
    workflow_dispatch:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

permissions:
    contents: read

jobs:
    distribution:
        name: Verify licensed downloads and source-only repository
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: '22'
            - run: node --test Distribution/worker.test.mjs
            - name: Reject packaged application files in source
              shell: bash
              run: |
                  if git ls-files | grep -Ei '\.(dmg|zip|pkg|ipa)$|\.app/'; then
                    echo 'Application packages belong in paid distribution, not GitHub source.'
                    exit 1
                  fi

    build:
        name: Build and test on macOS ${{ matrix.macos }} with Xcode ${{ matrix.xcode }}
        runs-on: macos-${{ matrix.macos }}
        env:
            DEVELOPER_DIR: "/Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer"
        strategy:
            fail-fast: false
            matrix:
                include:
                    - macos: "26"
                      xcode: "26.0"
        timeout-minutes: 15
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Record runner image version
              id: runner-image
              shell: bash
              run: printf 'version=%s\n' "${ImageVersion:-unknown}" >> "${GITHUB_OUTPUT}"

            - name: Cache Swift package dependencies
              uses: actions/cache@v5
              with:
                  path: ~/Library/Caches/org.swift.swiftpm
                  # Public repository caches can be restored by fork PRs. Never
                  # cache DerivedData: it contains downloadable application builds.
                  # A new key namespace also prevents restoring the old archives.
                  # Keep runner/SDK isolation for SwiftPM's compiled manifests.
                  key: ${{ runner.os }}-xcode-${{ matrix.xcode }}-img${{ steps.runner-image.outputs.version }}-packages-v2-${{ hashFiles('**/Package.resolved') }}
                  restore-keys: |
                      ${{ runner.os }}-xcode-${{ matrix.xcode }}-img${{ steps.runner-image.outputs.version }}-packages-v2-

            - name: Lint
              run: swift format lint --strict --recursive .

            - name: Build
              run: xcodebuild -quiet -project "Apple Core.xcodeproj" -scheme "Apple Core" -configuration Debug -destination "platform=macOS" build

            - name: Test
              run: xcodebuild -quiet -project "Apple Core.xcodeproj" -scheme "Apple Core" -configuration Debug -destination "platform=macOS" test

            # Scripts/integration_test.py write checks require named disposable
            # Apple containers and are run manually, never in CI.

    secrets:
        name: Scan changed commits for secrets
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout full history
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@v3
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
