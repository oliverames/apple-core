name: CI

on:
    workflow_call:
    workflow_dispatch:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

permissions:
    contents: read

jobs:
    build:
        name: Build and test on macOS ${{ matrix.macos }} with Xcode ${{ matrix.xcode }}
        runs-on: macos-${{ matrix.macos }}
        env:
            DEVELOPER_DIR: "/Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer"
        strategy:
            fail-fast: false
            matrix:
                include:
                    - macos: "26"
                      xcode: "26.0"
        timeout-minutes: 15
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Record runner image version
              id: runner-image
              shell: bash
              run: printf 'version=%s\n' "${ImageVersion:-unknown}" >> "${GITHUB_OUTPUT}"

            - name: Cache Xcode build artifacts
              uses: actions/cache@v5
              with:
                  path: |
                      ~/Library/Developer/Xcode/DerivedData
                      ~/Library/Caches/org.swift.swiftpm
                  # ImageVersion is in the key because the cached DerivedData holds
                  # precompiled module files built against the runner image's SDK.
                  # When GitHub ships a new image the SDK modulemap mtime changes and
                  # every restored .pcm is rejected ("module.modulemap has been
                  # modified since the module file was built"), failing the build with
                  # exit 65 even on a docs-only commit. This blocked the v1.0.5 release
                  # gate on 2026-07-30. restore-keys carries it too, so a new image can
                  # never fall back to a previous image's module cache.
                  key: ${{ runner.os }}-xcode-${{ matrix.xcode }}-img${{ steps.runner-image.outputs.version }}-derived-${{ hashFiles('**/Package.resolved') }}
                  restore-keys: |
                      ${{ runner.os }}-xcode-${{ matrix.xcode }}-img${{ steps.runner-image.outputs.version }}-derived-

            - name: Lint
              run: swift format lint --strict --recursive .

            - name: Build
              run: xcodebuild -quiet -project "Apple Core.xcodeproj" -scheme "Apple Core" -configuration Debug -destination "platform=macOS" build

            - name: Test
              run: xcodebuild -quiet -project "Apple Core.xcodeproj" -scheme "Apple Core" -configuration Debug -destination "platform=macOS" test

            # Scripts/integration_test.py write checks require named disposable
            # Apple containers and are run manually, never in CI.

    secrets:
        name: Scan changed commits for secrets
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout full history
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@v3
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
